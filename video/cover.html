<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 식장 스크린 영상 표지 (1920×1080). 모바일 청첩장 첫 화면(왼쪽)과 커버(오른쪽)를 나란히 놓은 구성 -->
<style>
:root{--porcelain:#EFEDE8; --blush:#DAC6C4; --brown:#4A3122; --ink2:#565151}
*{box-sizing:border-box} html,body{margin:0; width:1920px; height:1080px; overflow:hidden}
body{display:grid; grid-template-columns:1fr 1fr; background:var(--porcelain)}
.l{display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--porcelain)}
.title{width:520px; margin:0 0 56px}
.row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:44px; width:100%; padding:0 40px}
.row span{font-family:"Montserrat",sans-serif; font-size:30px; letter-spacing:.04em; color:#3A3634; white-space:nowrap}
.row span:first-child{text-align:right}
.photo{width:360px; height:540px; object-fit:cover; display:block}
.r{background:var(--blush); display:flex; flex-direction:column; justify-content:center; padding:0 120px}
.eyebrow{margin:0; font-family:"Montserrat",sans-serif; font-size:30px; letter-spacing:.3em; color:var(--brown)}
.names{width:640px; margin:34px 0 56px; display:block}
.when,.where{margin:0; font-family:"Noto Sans KR",sans-serif; font-size:36px; color:var(--ink2); line-height:1.75}
</style></head>
<body>
  <section class="l">
    <img class="title" src="../photos/wedinvt.png" alt="">
    <div class="row"><span>2026.11.14</span><img class="photo" src="../photos/01.jpg" alt=""><span>12:00 PM</span></div>
  </section>
  <section class="r">
    <p class="eyebrow">WEDDING DAY.</p>
    <img class="names" src="../photos/sj.png" alt="">
    <p class="when">2026. 11. 14 토 오후 12시</p>
    <p class="where">소피텔 앰배서더 서울 4F 그랜드 볼룸 방돔</p>
  </section>
</body></html>
