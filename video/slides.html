<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 식장 스크린 영상 장면들 (각 1920×1080). render-slides.js 가 장면마다 배경과 등장 요소를 따로 캡처합니다.
     글꼴은 모바일 청첩장과 같음: Pinyon Script(필기체) · Montserrat(영문 대문자) · Noto Sans KR(본문)
     data-step="n"  : 장면 안에서 n번째로 나타나는 요소 (같은 번호는 함께 나타남)
     data-fx="write": 필기체처럼 왼쪽부터 써지듯 나타남 (없으면 페이드 인)
     data-sec       : 장면 길이(초)
     문구를 바꾸려면 이 파일의 글자만 고치고 다시 렌더링하세요. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=Pinyon+Script&display=swap">
<style>
:root{--porcelain:#EFEDE8; --paper:#E7E3DC; --card:#F8F7F4; --blush:#DAC6C4; --brown:#4A3122; --ink:#2A2828; --ink2:#565151}
*{box-sizing:border-box} html,body{margin:0; background:#333}
.s{position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--porcelain); margin-bottom:20px}
img.p{position:absolute; object-fit:cover; display:block}
.script{font-family:"Pinyon Script",cursive; font-weight:400; color:var(--brown); line-height:1.1; margin:0}
.caps{font-family:"Montserrat",sans-serif; font-weight:400; letter-spacing:.3em; text-transform:uppercase; color:var(--brown); margin:0}
.ko{font-family:"Noto Sans KR",sans-serif; font-weight:300; color:var(--ink2); margin:0; line-height:2; word-break:keep-all}
.ko b{font-weight:400; color:var(--ink)}
.center{position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}

/* 00 첫 화면 (레이스) */
.op{display:flex; flex-direction:column; align-items:center; justify-content:center}
.op .title{width:640px; margin:-20px 0 -10px}
.op .row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:110px; width:100%}
.op .row span{font-family:"Montserrat",sans-serif; font-weight:400; font-size:40px; letter-spacing:.04em; color:#3A3634; white-space:nowrap}
.op .row span:first-child{text-align:right}
.op .lace{width:540px; height:540px; display:block}

/* 소개 — 사진 | 이름 | 사진 */
.intro .mid{left:672px; width:576px; top:0; height:1080px; background:var(--card)}
.intro .role{font-size:92px; margin-bottom:26px}
.intro .kn{font-family:"Noto Sans KR",sans-serif; font-weight:400; font-size:50px; letter-spacing:.42em; text-indent:.42em; color:var(--ink); margin:0 0 30px}
.intro .en{font-size:26px; letter-spacing:.22em; text-indent:.22em; color:var(--ink)}
</style></head>
<body>

<!-- 00 첫 화면 — 모바일 청첩장 첫 화면 그대로 (레이스 액자 사진). 레이스 위에 반짝임 효과(render-video.py) -->
<section class="s op" data-sec="6">
  <img class="title" src="../photos/wedinvt.png" alt="" data-step="0" data-fx="write">
  <div class="row"><span data-step="2">2026.11.14</span><img class="lace" src="../photos/main.jpg" alt="" data-step="1"><span data-step="2">12:00 PM</span></div>
</section>

<!-- 01 신랑 소개 -->
<section class="s intro" data-sec="6">
  <img class="p" src="../photos/g11-v2.jpg" style="left:0;top:0;width:672px;height:1080px;object-position:center 30%" data-step="0">
  <div class="center mid">
    <p class="script role" data-step="2" data-fx="write">Groom</p>
    <p class="kn" data-step="3">이석종</p>
    <p class="caps en" data-step="4">Lee Seokjong</p>
  </div>
  <img class="p" src="../photos/g14-v2.jpg" style="left:1248px;top:0;width:672px;height:1080px;object-position:center 40%" data-step="1">
</section>

<!-- 02 신부 소개 -->
<section class="s intro" data-sec="6">
  <img class="p" src="../photos/g04-v2.jpg" style="left:0;top:0;width:672px;height:1080px;object-position:center 25%" data-step="0">
  <div class="center mid">
    <p class="script role" data-step="2" data-fx="write">Bride</p>
    <p class="kn" data-step="3">신예진</p>
    <p class="caps en" data-step="4">Shin Yejin</p>
  </div>
  <img class="p" src="../photos/g09-v2.jpg" style="left:1248px;top:0;width:672px;height:1080px;object-position:center 30%" data-step="1">
</section>

<!-- 03 Our Story — 가운데 사진, 양옆에 필기체 (청첩장 문구 없음) -->
<section class="s" data-sec="6">
  <img class="p" src="../photos/g03-v2.jpg" style="left:640px;top:60px;width:640px;height:960px" data-step="0">
  <p class="script" style="position:absolute;right:1330px;top:450px;font-size:150px;text-align:right" data-step="1" data-fx="write">Our</p>
  <p class="script" style="position:absolute;left:1330px;top:450px;font-size:150px" data-step="2" data-fx="write">Story</p>
</section>

<!-- 04 흑백 가로 사진 꽉 채우기 (흑백 사진 위에는 글 없음) -->
<section class="s" data-sec="6">
  <img class="p" src="../photos/g05-v2.jpg" style="left:0;top:0;width:1920px;height:1080px;object-position:center 40%" data-step="0">
</section>

<!-- 05 두 장 세트 (글 없음) — 사진은 공개 저장소에 올리지 않고 video/local-photos/ 에만 둠 -->
<section class="s" data-sec="6">
  <img class="p" src="local-photos/set05-a.jpg" style="left:273px;top:40px;width:667px;height:1000px" data-step="0">
  <img class="p" src="local-photos/set05-b.jpg" style="left:980px;top:40px;width:667px;height:1000px" data-step="1">
</section>

<!-- 06 위에 제목, 아래 사진 두 장 -->
<section class="s" data-sec="6" style="background:var(--paper)">
  <p class="script" style="position:absolute;left:0;right:0;top:48px;text-align:center;font-size:104px" data-step="2" data-fx="write">Just as we are</p>
  <img class="p" src="../photos/g01-v2.jpg" style="left:420px;top:230px;width:520px;height:780px;object-position:center 30%" data-step="0">
  <img class="p" src="../photos/g07-v4.jpg" style="left:980px;top:230px;width:520px;height:780px;object-position:center 30%" data-step="1">
  <p class="ko" style="position:absolute;left:0;right:0;top:1022px;text-align:center;font-size:28px;line-height:1.4" data-step="3">있는 그대로를 사랑하며</p>
</section>

<!-- 07 오른쪽 사진 한 장 + 왼쪽 글 -->
<section class="s" data-sec="6">
  <img class="p" src="../photos/g10-v2.jpg" style="left:1160px;top:0;width:760px;height:1080px;object-position:center 40%" data-step="0">
  <div class="center" style="left:0;width:1160px;top:0;height:1080px">
    <p class="caps" style="font-size:26px;margin-bottom:40px" data-step="1">Always</p>
    <p class="script" style="font-size:120px" data-step="2" data-fx="write">on your side</p>
    <p class="ko" style="font-size:30px;margin-top:44px" data-step="3">평생 서로의 편이 되어</p>
  </div>
</section>

<!-- 08 큰 사진 + 작은 사진과 문구 -->
<section class="s" data-sec="6">
  <img class="p" src="../photos/g13-v2.jpg" style="left:0;top:0;width:720px;height:1080px;object-position:center 50%" data-step="0">
  <img class="p" src="../photos/g12-v2.jpg" style="left:880px;top:110px;width:480px;height:720px" data-step="1">
  <div style="position:absolute;left:1430px;top:110px;width:400px;height:720px;display:flex;flex-direction:column;justify-content:flex-end">
    <p class="caps" style="font-size:24px;line-height:2" data-step="2">Through<br>five seasons</p>
    <p class="ko" style="font-size:30px;margin-top:20px" data-step="3">다섯 해의 계절을 지나</p>
  </div>
  <p class="script" style="position:absolute;left:880px;top:880px;font-size:84px" data-step="4" data-fx="write">with you</p>
</section>

<!-- 09 두 장 + 아래 문구 -->
<section class="s" data-sec="6" style="background:var(--card)">
  <img class="p" src="../photos/g15-v2.jpg" style="left:390px;top:80px;width:540px;height:810px;object-position:center 30%" data-step="0">
  <img class="p" src="../photos/g16-v2.jpg" style="left:990px;top:80px;width:540px;height:810px" data-step="1">
  <div class="center" style="left:0;right:0;top:900px;height:180px">
    <p class="ko" style="font-size:30px" data-step="2">저희의 새로운 시작을 함께 축복해 주세요</p>
    <p class="caps" style="font-size:22px;margin-top:12px" data-step="3">A new beginning</p>
  </div>
</section>

<!-- 10 감사 인사 -->
<section class="s" data-sec="6" style="background:var(--blush)">
  <div class="center" style="left:0;right:0;top:0;bottom:0">
    <p class="script" style="font-size:190px" data-step="0" data-fx="write">Thank you</p>
    <p class="ko" style="font-size:36px;margin-top:40px;color:var(--ink)" data-step="1">함께해 주셔서 감사합니다</p>
    <p class="caps" style="font-size:26px;margin-top:60px" data-step="2">Seokjong &amp; Yejin · 2026.11.14</p>
  </div>
</section>

</body></html>
